<!DOCTYPE html>
<html>
<head>
<style>
  body { background: linear-gradient(to right, black 50%, white 50%); height: 200vh; margin: 0; }
  
  .fixed-header {
    position: fixed;
    top: 20px;
    left: 20px;
    right: 20px;
    height: 60px;
    z-index: 40;
    /* Does this isolate mix-blend-mode? */
  }
  
  .glass {
    position: absolute;
    inset: 0;
    background: rgba(100, 100, 100, 0.2);
    backdrop-filter: blur(10px);
  }
  
  .text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 20px;
    color: white;
    font-size: 24px;
    font-weight: bold;
    mix-blend-mode: difference;
  }
</style>
</head>
<body>
  <div class="fixed-header">
    <div class="glass"></div>
    <div class="text">DIFFERENCE TEXT</div>
  </div>
</body>
</html>
