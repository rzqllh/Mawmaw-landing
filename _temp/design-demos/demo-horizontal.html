<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opsi 3: Horizontal Scroll / Sticky Left</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#f7f6f2',
            surface: '#fffefa',
            'forest-900': '#112019',
            'gold-700': '#a88f2a',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap');
    body { background-color: #f7f6f2; color: #112019; overflow-x: hidden; }
    
    /* Hide scrollbar for horizontal container */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .h-card { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .h-card:hover { transform: scale(0.98); }
    .h-card img { transition: transform 0.7s ease; }
    .h-card:hover img { transform: scale(1.05); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const services = [
      { id: 1, title: "Konsultasi & Desain", desc: "Perencanaan tata ruang mendalam.", img: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&q=80&w=600" },
      { id: 2, title: "Renovasi Total", desc: "Transformasi ruang komprehensif.", img: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&q=80&w=600" },
      { id: 3, title: "Custom Furniture", desc: "Perabot presisi buatan tangan.", img: "https://images.unsplash.com/photo-1538688525198-9b88f6f53126?auto=format&fit=crop&q=80&w=600" },
      { id: 4, title: "Styling & Dekorasi", desc: "Sentuhan akhir material visual.", img: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&q=80&w=600" },
    ];

    function HorizontalLayout() {
      return (
        <div className="min-h-screen py-24 px-6 md:px-16 max-w-[1600px] mx-auto font-sans relative">
          <div className="flex flex-col lg:flex-row gap-12 lg:gap-24">
            
            {/* Sticky Left Content */}
            <div className="lg:w-1/3 lg:sticky lg:top-32 h-fit">
              <p className="text-xs font-bold uppercase tracking-widest text-gold-700 mb-4">Layanan Kami</p>
              <h2 className="text-5xl md:text-7xl font-serif text-forest-900 leading-none mb-6">Eksplorasi<br/>Layanan</h2>
              <p className="text-lg text-gray-600 mb-8 leading-relaxed">Pendekatan holistik kami memastikan setiap sudut ruang Anda dipikirkan dengan saksama, fungsional, dan estetis.</p>
              
              <div className="flex gap-4">
                <button className="w-12 h-12 rounded-full border border-forest-900/20 flex items-center justify-center hover:bg-forest-900 hover:text-white transition-colors" onClick={() => document.getElementById('scroll-container').scrollBy({left: -400, behavior: 'smooth'})}>
                  <i className="ph-arrow-left"></i>
                </button>
                <button className="w-12 h-12 rounded-full border border-forest-900/20 flex items-center justify-center hover:bg-forest-900 hover:text-white transition-colors" onClick={() => document.getElementById('scroll-container').scrollBy({left: 400, behavior: 'smooth'})}>
                  <i className="ph-arrow-right"></i>
                </button>
              </div>
            </div>

            {/* Horizontal Scroll Right Content */}
            <div id="scroll-container" className="lg:w-2/3 flex overflow-x-auto gap-6 hide-scrollbar pb-10 snap-x snap-mandatory" style={{ scrollPaddingLeft: '24px' }}>
              {services.map((s, i) => (
                <div key={s.id} className="h-card min-w-[320px] md:min-w-[420px] bg-surface rounded-[2rem] overflow-hidden shadow-xl shadow-black/5 snap-center shrink-0 flex flex-col">
                  <div className="h-72 overflow-hidden relative">
                    <img src={s.img} alt={s.title} className="w-full h-full object-cover" />
                    <div className="absolute top-4 left-4 w-10 h-10 bg-white/30 backdrop-blur-md rounded-full flex items-center justify-center text-white font-bold text-sm">0{i+1}</div>
                  </div>
                  <div className="p-8 flex-1 flex flex-col justify-center">
                    <h3 className="font-serif text-3xl text-forest-900 mb-3">{s.title}</h3>
                    <p className="text-gray-600 text-lg leading-relaxed">{s.desc}</p>
                    <div className="mt-8 flex items-center text-gold-700 font-bold text-sm tracking-wider uppercase cursor-pointer hover:text-forest-900 transition-colors">
                      Pelajari Lebih Lanjut <i className="ph-arrow-right ml-2"></i>
                    </div>
                  </div>
                </div>
              ))}
              {/* Spacer for right padding in horizontal scroll */}
              <div className="min-w-[40px] shrink-0"></div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HorizontalLayout />);
  </script>
</body>
</html>
