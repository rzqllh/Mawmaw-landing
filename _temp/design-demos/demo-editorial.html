<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opsi 2: Editorial Interactive List</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#f7f6f2',
            'forest-900': '#112019',
            'gold-700': '#a88f2a',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap');
    body { background-color: #f7f6f2; color: #112019; }
    .editorial-row { border-bottom: 1px solid rgba(17,32,25,0.1); transition: all 0.4s ease; }
    .editorial-row:hover { background-color: rgba(17,32,25,0.02); padding-left: 2rem; padding-right: 2rem; }
    .editorial-row:hover .row-img { opacity: 1; transform: scale(1) translateY(-50%); }
    .row-img { 
      position: absolute; right: 10%; top: 50%; transform: scale(0.95) translateY(-50%);
      opacity: 0; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none;
      width: 320px; height: 200px; object-fit: cover; border-radius: 1rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const services = [
      { id: '01', title: "Konsultasi & Desain", desc: "Perencanaan tata ruang dan konsep visual mendalam.", img: "https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&q=80&w=600" },
      { id: '02', title: "Renovasi Total", desc: "Transformasi ruang dari awal hingga akhir, zero-headache.", img: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&q=80&w=600" },
      { id: '03', title: "Custom Furniture", desc: "Perabot presisi yang dibuat khusus untuk proporsi Anda.", img: "https://images.unsplash.com/photo-1538688525198-9b88f6f53126?auto=format&fit=crop&q=80&w=600" },
      { id: '04', title: "Styling & Dekorasi", desc: "Sentuhan akhir material dan objek yang menghidupkan suasana.", img: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&q=80&w=600" },
    ];

    function EditorialList() {
      return (
        <div className="min-h-screen py-24 max-w-7xl mx-auto font-sans">
          <div className="mb-20 px-6 md:px-16">
            <p className="text-xs font-bold uppercase tracking-widest text-gold-700 mb-4">Layanan Kami</p>
            <h2 className="text-5xl md:text-7xl font-serif text-forest-900 leading-none">Eksplorasi Layanan</h2>
          </div>

          <div className="border-t border-black/10">
            {services.map((s) => (
              <div key={s.id} className="editorial-row relative flex flex-col md:flex-row md:items-center py-12 px-6 md:px-16 cursor-pointer group">
                <span className="text-lg font-serif text-gray-400 w-16 mb-4 md:mb-0">{s.id}</span>
                <div className="md:w-1/2 relative z-10">
                  <h3 className="font-serif text-4xl md:text-6xl text-forest-900 mb-4 transition-transform duration-500 group-hover:translate-x-4">{s.title}</h3>
                  <p className="text-gray-500 text-lg max-w-md transition-transform duration-500 delay-75 group-hover:translate-x-4">{s.desc}</p>
                </div>
                
                {/* Floating Image Reveal */}
                <img src={s.img} alt={s.title} className="row-img hidden md:block z-0" />
                
                <div className="ml-auto mt-6 md:mt-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10 bg-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg">
                  <i className="ph-arrow-right text-xl"></i>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EditorialList />);
  </script>
</body>
</html>
